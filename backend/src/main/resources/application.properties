server.port=8080
spring.application.name=agripulse-backend

# Database Configuration with environment variable fallback
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:agripulse_suite_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:An@291006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.com.agripulse=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# SQL Data Initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.models=gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-latest,gemini-3.8-flash,gemini-3-flash-preview,gemini-pro-latest

# Groq LPU AI & Voice Configuration
groq.api.key=${GROQ_API_KEY:}
groq.models=openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b
groq.whisper.model=whisper-large-v3-turbo

